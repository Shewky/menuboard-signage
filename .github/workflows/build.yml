name: Build & Release Menuboard APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Deterministic Signing Keystore
      run: |
        if [ ! -f "anypay-release.jks" ]; then
          keytool -genkeypair -v \
            -keystore anypay-release.jks \
            -alias anypay_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass anypay123456 \
            -keypass anypay123456 \
            -dname "CN=Interfon, OU=IT, O=Interfon, L=Mersin, S=Mersin, C=TR"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add anypay-release.jks
          git commit -m "chore: add persistent signing keystore [skip ci]" || true
          git push || true
        fi

    - name: Inject Real GitHub Repository Name into Code
      run: |
        sed -i "s|KULLANICI_ADINIZ/menuboard-signage|${{ github.repository }}|g" app-menuboard/src/main/java/com/anypay/menuboard/MainActivity.kt
        sed -i "s|KULLANICI_ADINIZ/menuboard-signage|${{ github.repository }}|g" app-remote/src/main/java/com/anypay/remote/MainActivity.kt

    - name: Sync & Extract Version Across Both Modules
      id: extract_version
      run: |
        VERSION=$(grep 'versionName =' app-menuboard/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/' | tr -d '[:space:]')
        VCODE=$(grep 'versionCode =' app-menuboard/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/' | tr -d '[:space:]')
        
        # Kumanda (app-remote) sürümünü Menuboard ile zorla birebir eşitle:
        sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/g" app-remote/build.gradle.kts
        sed -i "s/versionCode = [0-9]*/versionCode = $VCODE/g" app-remote/build.gradle.kts
        
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "VCODE=$VCODE" >> $GITHUB_OUTPUT
        echo "Eşitlenen Sürüm: v$VERSION (Code: $VCODE)"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2.1'
        cache-disabled: true

    - name: Clean and Build Both APKs Without Cache
      run: gradle clean assembleDebug --no-build-cache --rerun-tasks --stacktrace

    - name: Rename APKs with Version
      run: |
        cp app-menuboard/build/outputs/apk/debug/app-menuboard-debug.apk app-menuboard-v${{ steps.extract_version.outputs.VERSION }}.apk
        cp app-remote/build/outputs/apk/debug/app-remote-debug.apk app-remote-v${{ steps.extract_version.outputs.VERSION }}.apk

    - name: Upload Menuboard APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Menuboard-APK-v${{ steps.extract_version.outputs.VERSION }}
        path: app-menuboard-v${{ steps.extract_version.outputs.VERSION }}.apk

    - name: Upload Remote APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Remote-APK-v${{ steps.extract_version.outputs.VERSION }}
        path: app-remote-v${{ steps.extract_version.outputs.VERSION }}.apk

    - name: Publish Automatic GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.VERSION }}
        name: Sürüm v${{ steps.extract_version.outputs.VERSION }}
        body: "Otomatik derlenen v${{ steps.extract_version.outputs.VERSION }} (versionCode: ${{ steps.extract_version.outputs.VCODE }}) sürümü."
        prerelease: false
        overwrite: true
        files: |
          app-menuboard-v${{ steps.extract_version.outputs.VERSION }}.apk
          app-remote-v${{ steps.extract_version.outputs.VERSION }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
