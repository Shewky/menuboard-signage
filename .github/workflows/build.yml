name: Build Menuboard & Remote APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2.1'

    - name: Build Both APKs
      run: gradle assembleDebug --stacktrace

    - name: Upload Menuboard APK
      uses: actions/upload-artifact@v4
      with:
        name: Menuboard-Debug-APK
        path: app-menuboard/build/outputs/apk/debug/*.apk

    - name: Upload Remote APK
      uses: actions/upload-artifact@v4
      with:
        name: Remote-Debug-APK
        path: app-remote/build/outputs/apk/debug/*.apk
